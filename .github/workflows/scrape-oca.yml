name: Scrape beneficios OCA

on:
  schedule:
    - cron: '0 14 * * 1,5'   # lunes y viernes, 14:00 UTC
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecución'
        required: true
        default: 'diag'
        type: choice
        options:
          - diag        # guarda HTMLs como artifacts, no escribe JSON
          - produccion  # escribe data/beneficios-oca.json y commitea

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del scraper
        working-directory: scraper
        run: npm install

      - name: Iniciar Xvfb (display virtual para Chrome no-headless)
        run: |
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1280x1024x24 -ac +extension GLX +render -noreset &
          sleep 2
          echo "Xvfb started on :99"

      - name: Ejecutar scraper (modo diagnóstico)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'diag' }}
        working-directory: scraper
        env:
          DISPLAY: ':99'
          CHROME_PATH: /usr/bin/google-chrome
        run: node scrape-oca.js --diag

      - name: Ejecutar scraper (modo producción)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'produccion') }}
        working-directory: scraper
        env:
          DISPLAY: ':99'
          CHROME_PATH: /usr/bin/google-chrome
        run: node scrape-oca.js

      - name: Subir artifacts de diagnóstico
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'diag' }}
        uses: actions/upload-artifact@v4
        with:
          name: oca-diag
          path: |
            scraper/output/oca-*.html
            scraper/output/oca-*.txt
          if-no-files-found: ignore

      - name: Commitear datos si cambiaron
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.modo == 'produccion') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/beneficios-oca.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "chore: actualizar beneficios OCA (scrape automático)"
            git pull --rebase origin main
            git push
          fi

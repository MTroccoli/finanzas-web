name: Scrape beneficios BBVA

on:
  schedule:
    - cron: '0 9 1 * *'   # 1º de cada mes, 09:00 UTC
  workflow_dispatch:        # permite dispararlo manualmente

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del scraper
        working-directory: scraper
        run: npm install

      - name: Ejecutar scraper
        working-directory: scraper
        run: node scrape-bbva.js

      - name: Subir HTML renderizado (diagnóstico)
        uses: actions/upload-artifact@v4
        with:
          name: rendered-html
          path: scraper/output/*.html
          if-no-files-found: ignore

      - name: Commitear datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/beneficios-bbva-raw.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "chore: actualizar beneficios BBVA (scrape automático)"
            git push
          fi

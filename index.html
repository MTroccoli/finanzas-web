<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Finanzas App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header id="topbar">
    <div class="topbar-left">
      <div class="logo">💰 FINANZAS <span>APP</span></div>
      <div class="logo-sub">Panel de control · Patrimonio personal</div>
    </div>
    <div class="live-badge"><span class="live-dot"></span>EN VIVO</div>
  </header>

  <nav id="mainnav">
    <a href="#dashboard"     class="nav-item" data-page="dashboard">
      <span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span>
    </a>
    <a href="#inversiones"   class="nav-item" data-page="inversiones">
      <span class="nav-icon">📈</span><span class="nav-label">Inversiones</span>
    </a>
    <a href="#gastos"        class="nav-item" data-page="gastos">
      <span class="nav-icon">💸</span><span class="nav-label">Gastos</span>
    </a>
    <a href="#ingresos"      class="nav-item" data-page="ingresos">
      <span class="nav-icon">💵</span><span class="nav-label">Ingresos</span>
    </a>
    <a href="#presupuesto"   class="nav-item" data-page="presupuesto">
      <span class="nav-icon">🎯</span><span class="nav-label">Presupuesto</span>
    </a>
    <a href="#configuracion" class="nav-item" data-page="configuracion">
      <span class="nav-icon">⚙️</span><span class="nav-label">Config</span>
    </a>
  </nav>

  <nav id="subnav" class="hidden">
    <a href="#inversiones/portafolio"   class="sub-item" data-sub="portafolio">📋 Portafolio</a>
    <a href="#inversiones/rentabilidad" class="sub-item" data-sub="rentabilidad">📊 Rentabilidad</a>
    <a href="#inversiones/mercado"      class="sub-item" data-sub="mercado">🌐 Mercado</a>
    <a href="#inversiones/operaciones"  class="sub-item" data-sub="operaciones">🔄 Operaciones</a>
  </nav>

  <main id="content"></main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js" charset="utf-8"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="modules/dashboard.js"></script>
  <script src="modules/inversiones.js"></script>
  <script src="modules/gastos.js"></script>
  <script src="modules/ingresos.js"></script>
  <script src="modules/presupuesto.js"></script>
  <script src="modules/config_page.js"></script>
  <script src="js/app.js"></script>
  <script>
    // iOS 10+ ignora user-scalable=no — bloquear pinch/zoom vía events
    ['touchstart','touchmove'].forEach(t =>
      document.addEventListener(t, function(e) {
        if (e.touches && e.touches.length > 1) e.preventDefault();
      }, { passive: false })
    );
    // Gesture events nativos de Safari (pinch/rotate)
    ['gesturestart','gesturechange','gestureend'].forEach(t =>
      document.addEventListener(t, function(e) { e.preventDefault(); }, { passive: false })
    );
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup — Menú lateral</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0f1117;
      --surface:    #1a1d27;
      --border:     rgba(255,255,255,.08);
      --text:       #e8e8e8;
      --text-sec:   #8b8fa8;
      --accent:     #2e7fd9;
      --sidenav-w:  220px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    #topbar {
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 14px;
      flex-shrink: 0;
      position: relative;
      z-index: 30;
    }

    #hamburger {
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background .15s;
      background: none;
      border: none;
    }
    #hamburger:hover { background: rgba(255,255,255,.06); }
    #hamburger span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform .25s, opacity .25s;
    }
    /* Hamburger → X when open */
    body.nav-open #hamburger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    body.nav-open #hamburger span:nth-child(2) { opacity: 0; }
    body.nav-open #hamburger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    #topbar-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      color: var(--accent);
      letter-spacing: .06em;
    }

    #topbar-page {
      font-size: .8rem;
      color: var(--text-sec);
      margin-left: auto;
    }

    /* ── Layout below topbar ── */
    #layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ── Side nav ── */
    #sidenav {
      width: var(--sidenav-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      flex-shrink: 0;
      transform: translateX(calc(-1 * var(--sidenav-w)));
      transition: transform .25s cubic-bezier(.4,0,.2,1);
      position: absolute;
      top: 0; bottom: 0; left: 0;
      z-index: 20;
    }
    body.nav-open #sidenav { transform: translateX(0); }

    .nav-section-label {
      font-size: .62rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-sec);
      padding: 14px 20px 6px;
    }

    .side-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 20px;
      font-size: .88rem;
      color: var(--text-sec);
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .12s, color .12s, border-color .12s;
      text-decoration: none;
      user-select: none;
    }
    .side-item:hover {
      background: rgba(255,255,255,.04);
      color: var(--text);
    }
    .side-item.active {
      color: var(--accent);
      border-left-color: var(--accent);
      background: rgba(46,127,217,.08);
      font-weight: 600;
    }

    .side-item-icon {
      width: 18px;
      height: 18px;
      opacity: .6;
      flex-shrink: 0;
    }
    .side-item.active .side-item-icon { opacity: 1; }

    .side-divider {
      margin: 8px 16px;
      border: none;
      border-top: 1px solid var(--border);
    }

    .side-user {
      margin-top: auto;
      padding: 14px 20px 10px;
      border-top: 1px solid var(--border);
    }
    .side-user-email {
      font-size: .72rem;
      color: var(--text-sec);
      font-family: 'DM Mono', monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 8px;
    }
    .side-signout {
      font-size: .8rem;
      color: #f87171;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: .8;
      transition: opacity .15s;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0;
    }
    .side-signout:hover { opacity: 1; }

    /* ── Overlay ── */
    #overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 10;
    }
    body.nav-open #overlay { display: block; }

    /* ── Main content ── */
    #main {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      transition: filter .25s;
    }
    body.nav-open #main { filter: brightness(.6); }

    .page-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: var(--text);
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .page-sub {
      font-size: .82rem;
      color: var(--text-sec);
      margin-bottom: 24px;
    }
    .placeholder-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 120px;
      margin-bottom: 16px;
      opacity: .5;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div id="topbar">
    <button id="hamburger" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
    <span id="topbar-title">Finanzas</span>
    <span id="topbar-page">Análisis</span>
  </div>

  <div id="layout">

    <!-- Side nav -->
    <nav id="sidenav">
      <span class="nav-section-label">Principal</span>

      <a class="side-item active" data-page="dashboard">
        <svg class="side-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Análisis
      </a>
      <a class="side-item" data-page="inversiones">
        <svg class="side-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        Inversiones
      </a>
      <a class="side-item" data-page="gastos">
        <svg class="side-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Gastos
      </a>
      <a class="side-item" data-page="ingresos">
        <svg class="side-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Ingresos
      </a>

      <hr class="side-divider">
      <span class="nav-section-label">Sistema</span>

      <a class="side-item" data-page="configuracion">
        <svg class="side-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configuración
      </a>

      <div class="side-user">
        <div class="side-user-email">usuario@email.com</div>
        <button class="side-signout">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar sesión
        </button>
      </div>
    </nav>

    <!-- Overlay para cerrar -->
    <div id="overlay"></div>

    <!-- Contenido principal -->
    <main id="main">
      <div class="page-title">Análisis</div>
      <div class="page-sub">Resumen general del patrimonio</div>
      <div class="placeholder-card"></div>
      <div class="placeholder-card" style="height:200px"></div>
      <div class="placeholder-card" style="height:80px"></div>
    </main>

  </div>

  <script>
    const body = document.body;
    const hamburger = document.getElementById('hamburger');
    const overlay   = document.getElementById('overlay');
    const topbarPage = document.getElementById('topbar-page');

    hamburger.addEventListener('click', () => body.classList.toggle('nav-open'));
    overlay.addEventListener('click',   () => body.classList.remove('nav-open'));

    document.querySelectorAll('.side-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.side-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        topbarPage.textContent = item.textContent.trim();
        body.classList.remove('nav-open');
      });
    });
  </script>

</body>
</html>
